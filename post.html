  <!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
  </head>
  
  <body>
    <section class="hero-section">
        <video autoplay muted loop playsinline id="hero-video">
          <source src="videos/8061028-hd_1920_1080_25fps.mp4" type="video/mp4">
          Your browser does not support the video tag.
        </video>
        <div class="overlay"></div>
        <div class="hero-content">
          <h1>Your Headline</h1>
          <p>Your subheadline or call to action</p>
          <a href="#" class="cta-button">Get Started</a>
        </div>
      </section>
      <style>
      .hero-section {
  position: relative;
  width: 100%;
  height: 100vh; /* Full viewport height */
  overflow: hidden;
}

#hero-video {
  position: absolute;
  top: 50%;
  left: 50%;
  min-width: 100%;
  min-height: 100%;
  width: auto;
  height: auto;
  z-index: 1;
  transform: translate(-50%, -50%);
  object-fit: cover; /* Ensures video covers the whole section */
}

.overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.5); /* Dark overlay for text readability */
  z-index: 2;
}

.hero-content {
  position: relative;
  z-index: 3;
  text-align: center;
  color: white;
  top: 50%;
  transform: translateY(-50%);
}

.cta-button {
  padding: 10px 20px;
  background-color: #ff6f61;
  color: #fff;
  text-decoration: none;
  border-radius: 5px;
  font-weight: bold;
}

.cta-button:hover {
  background-color: #ff3e2d;
}
 
      </style>

<script>
    document.addEventListener("scroll", function () {
  const video = document.getElementById('hero-video');
  const rect = video.getBoundingClientRect();
  if (rect.bottom < 0 || rect.top > window.innerHeight) {
    video.pause();
  } else {
    video.play();
  }
});

</script>

  </body>

  </html>
